<!doctype html>
<!--
  Ripple's store background (3840x1240, no text) and cover (600x900, the mark and the wordmark), in one of three
  directions: ?direction=ripples|posters|pieces&format=background|cover. scripts/store-art.mjs screenshots it.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #05080b; overflow: hidden; }
  .frame { position: relative; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mark { position: absolute; transform: translate(-50%, -50%); filter: drop-shadow(0 10px 28px rgba(3, 8, 14, 0.55)); }
  .wordmark {
    position: absolute; left: 0; right: 0; text-align: center;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-weight: 900; letter-spacing: 0.06em; color: #f2f2f2;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
<div class="frame">
  <canvas></canvas>
  <img class="mark" src="/src/assets/logo.svg" alt="">
</div>
<script type="module">
import { FILMS, drawFrame } from './frames.js'

const query = new URLSearchParams(location.search)
const direction = query.get('direction') ?? 'ripples'
const cover = query.get('format') === 'cover'
const [W, H] = cover ? [600, 900] : [3840, 1240]
// fkn.app's hero is at most 400px tall and holds the background at `object-position: 50% 10%`, with the name's
// scrim over its lower half, so the mark sits in the top quarter as stub's does; the cover's leaves room for the name
const [mx, my, size] = cover ? [300, 360, 290] : [1920, 290, 400]

const frame = document.querySelector('.frame')
frame.style.width = `${W}px`
frame.style.height = `${H}px`
const canvas = document.querySelector('canvas')
canvas.width = W
canvas.height = H
const g = canvas.getContext('2d')
const mark = document.querySelector('.mark')
Object.assign(mark.style, { left: `${mx}px`, top: `${my}px`, width: `${size}px` })

let seed = 11
const random = () => {
  seed = (seed + 0x6d2b79f5) | 0
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296
}

const radial = (x, y, r, stops) => {
  const gradient = g.createRadialGradient(x, y, 0, x, y, r)
  for (const [at, colour] of stops) gradient.addColorStop(at, colour)
  g.fillStyle = gradient
  g.fillRect(0, 0, W, H)
}

// the light the mark stands in, pale enough that its slate blue reads against it
const pool = (core = 0.92) => radial(mx, my, size * 1.25, [
  [0, `rgba(198, 219, 234, ${core})`],
  [0.3, `rgba(162, 192, 212, ${core * 0.8})`],
  [0.62, `rgba(70, 102, 126, ${core * 0.3})`],
  [1, 'rgba(40, 60, 76, 0)'],
])

// 0 under the mark, rising to 1 a little outside it, so what is drawn behind it gives way to the pool
const calm = (x, y) => {
  const t = Math.min(1, Math.max(0, (Math.hypot(x - mx, y - my) - size * 0.4) / (size * 0.4)))
  return t * t * (3 - 2 * t)
}

// darker toward the edges and the bottom, where the page sets the name over it
const vignette = () => {
  radial(mx, my, Math.max(W, H) * 0.62, [[0.25, 'rgba(4, 6, 9, 0)'], [1, 'rgba(4, 6, 9, 0.8)']])
  const bottom = g.createLinearGradient(0, H * 0.55, 0, H)
  bottom.addColorStop(0, 'rgba(4, 6, 9, 0)')
  bottom.addColorStop(1, 'rgba(4, 6, 9, 0.85)')
  g.fillStyle = bottom
  g.fillRect(0, 0, W, H)
}

// a drop has fallen where the mark is, and its rings spread over dark water seen at a low angle, each lit on the
// side that faces the light above it: a height field shaded pixel by pixel
const ripples = () => {
  const image = g.createImageData(W, H)
  const unit = cover ? 0.4 : 1
  const squash = 0.3
  const height = (r) => {
    const rise = Math.min(1, Math.max(0, (r - 160) / 420))
    return rise * rise * (3 - 2 * rise) * Math.exp(-r / 1700) * Math.sin(0.82 * Math.sqrt(r) * Math.PI)
  }
  for (let y = 0; y < H; y++) {
    const depth = y / H
    const base = [7 - 3 * depth, 14 - 7 * depth, 22 - 11 * depth]
    for (let x = 0; x < W; x++) {
      const dx = (x - mx) / unit
      const dy = (y - my) / unit / squash
      const r = Math.hypot(dx, dy) || 1
      const slope = (height(r + 1) - height(r - 1)) / 2
      const lit = calm(x, y) * Math.max(-1, Math.min(1, -slope * (dy / r) * 26 - slope * (dx / r) * 6))
      const at = (y * W + x) * 4
      const crest = lit > 0 ? [168, 200, 222] : [0, 0, 0]
      const amount = Math.abs(lit) * (lit > 0 ? 0.85 : 0.6)
      image.data[at] = base[0] + (crest[0] - base[0]) * amount
      image.data[at + 1] = base[1] + (crest[1] - base[1]) * amount
      image.data[at + 2] = base[2] + (crest[2] - base[2]) * amount
      image.data[at + 3] = 255
    }
  }
  g.putImageData(image, 0, 0)
  pool(0.97)
  vignette()
}

// the library's posters as a wall, out of focus, the way stub's shows its own
const posters = () => {
  g.fillStyle = '#06080b'
  g.fillRect(0, 0, W, H)
  const tw = cover ? 220 : 560
  const th = Math.round(tw * 9 / 16)
  const gap = cover ? 14 : 34
  const tiles = document.createElement('canvas')
  tiles.width = W + tw * 3
  tiles.height = H + th * 3
  const t = tiles.getContext('2d')
  const stills = FILMS.map((film) => {
    const still = document.createElement('canvas')
    still.width = 640
    still.height = 360
    drawFrame(still.getContext('2d'), film, 640, 360)
    return still
  })
  let n = 0
  for (let y = 0; y < tiles.height; y += th + gap) {
    for (let x = -Math.round(random() * tw); x < tiles.width; x += tw + gap) {
      const still = stills[(n++ * 3 + Math.floor(y)) % stills.length]
      t.save()
      t.beginPath(); t.roundRect(x, y, tw, th, cover ? 10 : 20); t.clip()
      if (random() > 0.5) { t.translate(x + tw, y); t.scale(-1, 1); t.drawImage(still, 0, 0, tw, th) }
      else t.drawImage(still, x, y, tw, th)
      t.restore()
    }
  }
  g.save()
  g.filter = `blur(${cover ? 6 : 16}px) brightness(0.62) saturate(1.1)`
  g.translate(W / 2, H / 2)
  g.rotate(-0.07)
  g.drawImage(tiles, -tiles.width / 2, -tiles.height / 2)
  g.restore()
  radial(mx, my, size * 1.5, [[0, 'rgba(5, 8, 11, 0.75)'], [0.7, 'rgba(5, 8, 11, 0.45)'], [1, 'rgba(5, 8, 11, 0)']])
  pool(0.9)
  vignette()
}

// a torrent's pieces as a map, filled from where the mark is outward, the edge still coming in
const pieces = () => {
  g.fillStyle = '#05080b'
  g.fillRect(0, 0, W, H)
  const cell = cover ? 26 : 58
  const piece = cell - (cover ? 6 : 12)
  const reach = cover ? 300 : 1350
  const rows = Math.ceil(H / cell)
  const columns = Math.ceil(W / cell)
  for (let row = 0; row < rows; row++) {
    for (let column = 0; column < columns; column++) {
      const x = column * cell + (W - columns * cell + cell - piece) / 2
      const y = row * cell + (H - rows * cell + cell - piece) / 2
      const d = Math.hypot((x - mx) / (cover ? 1 : 1.15), (y - my) * (cover ? 1 : 1.6)) / reach
      const roll = random()
      const have = roll < 1.25 - d * 1.1
      const coming = !have && roll < 1.55 - d * 1.1
      const light = Math.max(0, 1 - d * 0.75)
      g.globalAlpha = calm(x + piece / 2, y + piece / 2)
      g.beginPath(); g.roundRect(x, y, piece, piece, cover ? 3 : 8)
      if (have) {
        g.fillStyle = `rgb(${Math.round(36 + 90 * light)}, ${Math.round(56 + 100 * light)}, ${Math.round(72 + 108 * light)})`
        g.fill()
      } else {
        g.fillStyle = 'rgba(24, 33, 40, 0.8)'
        g.fill()
        if (coming) {
          const filled = 0.2 + random() * 0.6
          g.fillStyle = `rgba(${Math.round(60 + 80 * light)}, ${Math.round(88 + 92 * light)}, ${Math.round(110 + 98 * light)}, 0.8)`
          g.beginPath(); g.roundRect(x, y + piece * (1 - filled), piece, piece * filled, cover ? 3 : 8); g.fill()
        }
      }
    }
  }
  g.globalAlpha = 1
  pool(1)
  vignette()
}

await { ripples, posters, pieces }[direction]()
await mark.decode()

if (cover) {
  const name = Object.assign(document.createElement('div'), { className: 'wordmark', textContent: 'Ripple' })
  Object.assign(name.style, { top: '620px', fontSize: '112px' })
  frame.append(name)
  await document.fonts.ready
}
document.body.dataset.ready = '1'
</script>
</body>
</html>
