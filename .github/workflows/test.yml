name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # e2e-swarm only. 03:17 rather than on the hour, where every other cron in the world queues.
  schedule:
    - cron: '17 3 * * *'

# A newer push makes the older answer worthless, and these jobs hold a browser for minutes. The
# scheduled run is never cancelled: it is the only thing watching the swarm lane.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pure logic in node: no browser, no build, no network. `tests/lanes.test.ts` lives here on purpose,
  # so a spec added to no lane fails in the FAST suite rather than being silently never run.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Components mounted in a real Chrome. It does NOT need build/ output: the one test that wanted
  # build/libav-worker.js says so itself and skips when it is absent.
  # ADVISORY, and this one has a reason of its own rather than being unproven.
  #
  # It passes: 307 of 307 tests green. What fails is an IMPORT, "Vitest failed to find the runner",
  # on a cold dependency-optimizer cache, and it clears on a re-run with the cache warm.
  #
  # PART OF THAT WAS NOT A FLAKE, and this comment called the whole of it one until 2026-09-03. A
  # dependency reached for the first time DURING a run makes vite re-optimize and reload the page,
  # which the test runner does not survive, and the error names neither the dependency nor the
  # reload. Listing it in `optimizeDeps.include` fixes that half: `@banou/ponyfill` enters through
  # save-file.ts, which one browser test loads via importOriginal. Measured 2026-09-03 on six cold
  # runs, cache deleted before each: without the entry 0 of 2 passed, with it 5 of 6.
  #
  # So a residual flake IS real, at roughly one cold run in six, and that is why this stays advisory.
  # What changed is that the deterministic half of it is gone rather than being filed under the same
  # word.
  #
  # 2026-10-04: three more of that kind were reloading on every CI run, `@fkn/lib/net` and
  # `@fkn/lib/dgram` through the engine worker and `react-router` through the SPA fallback that a
  # missing build/libav-worker.js lands on. Whether they were the one in six is not measured yet.
  #
  # `e2e-local` used to sit here too. Its first run failed 13 of 35 while the identical lane passed
  # 35 of 35 locally, on environment differences a local run cannot show: a runner low on disk renders
  # a storage-relief button and a storage `status`, which made two selectors ambiguous, and its font
  # set moves the tabular readouts `stable-widths` measures. The selectors were real defects and are
  # fixed; the font ones moved to the `machine` lane. It is green on the runner now, so it blocks.
  browser:
    runs-on: ubuntu-24.04
    continue-on-error: true
    # 30, not 15: a cold runner optimizes the vite dep graph before a single test runs, and the first
    # attempt was killed at 15m17s, which GitHub reports as "cancelled" rather than as a timeout.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # ubuntu-24 restricts unprivileged user namespaces, which Chrome's sandbox needs. Lift the
      # restriction rather than passing --no-sandbox: the sandbox is the thing under the tests.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Point the browser project at the installed Chromium
        run: echo "RIPPLE_CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      # A mid run reload can still end green, and that is how `react-router` reloaded every run on
      # main until 2026-10-04 (tests/optimize-deps.test.ts), so the reload fails the step by name.
      # `shell: bash` runs with pipefail, so a failing suite still fails through the tee.
      - name: Browser tests, with no mid run reload
        shell: bash
        run: |
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/browser.log"
          if grep -qE 'optimized dependencies changed|unexpectedly reloaded a test' "$RUNNER_TEMP/browser.log"; then
            echo "::error::vite reloaded a test page mid run: add the dependency it names to optimizeDeps.include"
            exit 1
          fi

  # Playwright specs that need a browser and NOTHING else. Split by dependency rather than by cost:
  # these are deterministic, so they can gate a push.
  e2e-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # tests/volume-normalizer.spec.ts builds its episode with ffmpeg, as media-player's CI does its fixtures
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run test:e2e:local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-local-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The specs that watch a torrent actually move bytes. HEADFUL under Xvfb, because headless
  # Chromium reaches "Loading metadata" and sits at a flat 0 B/s forever while its data plane is
  # provably healthy. Nightly rather than per-push: it depends on strangers' seeders, so a red here
  # is a fact about the swarm as often as about the commit.
  e2e-swarm:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo apt-get install -y xvfb
      # `machine` before `swarm`: it is fast, and it measures the RUNNER (font metrics), so a failure
      # here says the environment moved rather than that the code did.
      - run: npm run test:e2e:machine
      - run: xvfb-run -a -s "-screen 0 1280x720x24" npm run test:e2e:swarm
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-swarm-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
