# Publishes @banou/ripple to npm with no token stored anywhere: the job exchanges its OIDC identity
# for a short lived credential against the trusted publisher registered on npmjs.org.
#
# THE FILENAME IS PART OF THE TRUST RELATIONSHIP AND MUST NOT CHANGE. npm binds the package to a
# repository PLUS a workflow filename (banou26/ripple + publish-lib.yml), so renaming this file
# breaks publishing and has to be re-registered on npmjs.org by hand. Both halves are case
# sensitive: the account renamed Banou26 to banou26 on 2026-09-11 and a capital B in the form is a
# different string to the OIDC claim. The `name:` below is display text and is safe to edit.
#
# Only a version bump publishes. Every other push to main is a Cloudflare Pages deploy and nothing
# else, so the version gate below is what keeps this from fighting the registry on every commit.
name: Publish

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # for re-running a publish that failed after the version already landed, which a push cannot repeat
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The three retry windows below are 30 minutes, 10 and 2, so 42 of this is spent waiting on a
    # registry or a bucket before the build is counted at all. A timeout that expires PAST the
    # publish spends a version whose published bytes are then never read: a workflow_dispatch re-run
    # reads changed=false from the gate and runs none of the release steps, so the steps that read
    # what is actually served never happen.
    timeout-minutes: 60
    permissions:
      # the OIDC token npm exchanges for short lived publish credentials
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # NO registry-url on purpose. That input writes an .npmrc pinning the auth token to
      # ${NODE_AUTH_TOKEN}, which is empty here, so npm believes it is already authenticated, skips
      # the OIDC exchange entirely, and the publish dies with an E404 PUT that names the package
      # rather than the credential. registry.npmjs.org is npm's default, so nothing is lost.
      #
      # Node 22 because that is what every other gate in this repo builds under: the build runs the
      # vite-plus toolchain, and a publish is the wrong place to be the first run on a newer runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer, which no node 22 image ships. Pinned rather
      # than assumed: an npm too old fails at the publish step with an auth error that reads like a
      # revoked credential rather than a stale CLI.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)"

      - run: npm ci

      # Trusted publishing turns provenance on by itself, and the registry then checks that this
      # manifest names the repository the statement was signed against. A missing or mismatched
      # `repository` is refused with a 422 AFTER the OIDC exchange has succeeded and the statement
      # has been written to the public transparency log, so the cost of finding out late is a
      # permanent sigstore entry for a version that never published. Asked here, for a second.
      - name: The manifest has to name this repository
        run: |
          URL=$(node -p "require('./package.json').repository?.url ?? ''")
          CLEAN=${URL#git+}
          CLEAN=${CLEAN%.git}
          if [ "$CLEAN" != "https://github.com/$GITHUB_REPOSITORY" ]; then
            echo "::error::package.json repository.url is '$CLEAN', and provenance expects 'https://github.com/$GITHUB_REPOSITORY'"
            exit 1
          fi
          echo "::notice::repository.url matches $GITHUB_REPOSITORY"

      # Decide BEFORE building, so an unchanged version costs seconds rather than a full build.
      #
      # The gate reads the WHOLE packument, because a 404 on the version document is not proof that a
      # number is free: npm reserves an unpublished version forever. 0.0.6 was the proof, on the very
      # first run of this workflow (2026-09-11). See scripts/npm-version-gate.mjs.
      - name: Decide whether the version moved
        id: decide
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          DOC=$(node -p "encodeURIComponent(require('./package.json').name)")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "doc=$DOC" >> "$GITHUB_OUTPUT"
          if OUT=$(node scripts/npm-version-gate.mjs "$NAME" "$VERSION" 2> "$RUNNER_TEMP/gate.err"); then
            echo "::notice::$(cat "$RUNNER_TEMP/gate.err")"
            echo "$OUT" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$(cat "$RUNNER_TEMP/gate.err")"
            exit 1
          fi

      # THE BUILT SITE IS THE PACKAGE, and `npm run build` ends by writing build/package.json and
      # running scripts/check-npm-package.mjs over it. The platform maps a tenant path 1:1 onto a
      # package path, and ripple asks for `/libav-worker.js` and `/assets/worker-<hash>.js` because
      # on torrent.fkn.app the origin root is build/. Publishing the repo root put every one of those
      # a directory too deep, which is what 0.0.7 shipped.
      - name: Build
        if: steps.decide.outputs.changed == 'true'
        run: npm run build

      # The release manifest, and the first one this repo signs in CI. `npm run sign` holds the one
      # copy of the source list; the assertion below is what keeps it honest.
      #
      # AFTER the build, because the list is the packlist of build/ and `write-npm-manifest.mjs`
      # writes build/package.json at the end of that build. The secret holds the raw signing seed, so
      # nothing here prints it and fkn-sign reads it straight out of the environment.
      - name: Sign the release manifest over the packlist
        if: steps.decide.outputs.changed == 'true'
        env:
          FKN_SIGNING_KEY: ${{ secrets.FKN_SIGNING_KEY }}
        run: npm run sign

      # `sources` decides which source the platform will accept this manifest from, and a signature
      # that verifies says nothing about that list being right. These two are the sources this release
      # is FETCHED from, and a missing one is SOURCE_NOT_LISTED at every consumer of it: without npm:
      # for anyone installing from the registry, without https-pkg: for anyone loading it from
      # torrent.fkn.app's own index, and the version is burned by the time either is read. Asked of
      # the signed document rather than of the command that wrote it.
      - name: The release manifest lists the sources it is served from
        if: steps.decide.outputs.changed == 'true'
        run: |
          node -e "
            const manifest = require('./fkn.json')
            const sources = Array.isArray(manifest.sources) ? manifest.sources : []
            const missing = ['npm:@banou/ripple', 'https-pkg:torrent.fkn.app/ripple'].filter((source) => !sources.includes(source))
            if (missing.length) {
              console.error('fkn.json sources are ' + JSON.stringify(sources) + ', which does not include ' + missing.join(' '))
              process.exit(1)
            }
            console.log('sources ' + sources.join(' '))
          "

      # `place` runs after `sign` so both copies carry the list rather than the identity-only document
      # the build placed. `check` compares the packlist against the list and every copy against the
      # root; `verify --contents` re-hashes the tree the list was built from.
      - name: Place, check and verify the release manifest
        if: steps.decide.outputs.changed == 'true'
        run: |
          npx fkn-sign place --out build
          npx fkn-sign check --package build/package.json
          npx fkn-sign verify fkn.json --contents build --source npm:@banou/ripple

      # The readers deployed today cap a manifest at 16384 bytes and ignore `contents` entirely,
      # which is what lets this release verify under them exactly as the identity-only ones did. Past
      # the cap they refuse it outright, so the size is a gate rather than a note.
      - name: The release manifest stays under the deployed readers' cap
        if: steps.decide.outputs.changed == 'true'
        run: |
          SIZE=$(wc -c < fkn.json)
          if [ "$SIZE" -gt 16384 ]; then
            echo "::error::fkn.json is $SIZE bytes, over the 16384 byte cap the deployed readers read it under"
            exit 1
          fi
          echo "::notice::fkn.json is $SIZE bytes"

      - name: The built manifest has to be the one the gate cleared
        if: steps.decide.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          BUILT=$(node -p "require('./build/package.json').version")
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::build/package.json is $BUILT and the repo is $VERSION"
            exit 1
          fi
          echo "::notice::publishing build/ as $(node -p "require('./build/package.json').name") $BUILT"

      # No credential is passed. npm exchanges the job's OIDC identity for a short lived token against
      # the trusted publisher configured on npmjs.org for banou26/ripple + publish-lib.yml. A
      # publisher that does not match this repository and filename surfaces only as a bare ENEEDAUTH,
      # which is why the log level is raised: at verbose the exchange prints its own answer,
      # "OIDC token exchange error - package not found", a message about the match rather than the
      # package.
      - name: Publish
        if: steps.decide.outputs.changed == 'true'
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        # ./build, never `build`: a bare name is a PACKAGE SPEC to npm, so `npm publish build` reaches
        # for the registry's own `build` package rather than this directory (measured 2026-09-12,
        # `npm pack build` returned build@0.1.4 from the registry).
        run: npm publish ./build --access public

      # Ask the REGISTRY, not the runner. Everything above is a claim about what was uploaded; this is
      # the only step that observes what a consumer would actually get. The registry answers the PUT
      # with 202 and processes the version afterwards, so it appears minutes later, and how many
      # varies: 0.0.9 took about 4, 0.0.10 took 10 min 12 s and failed the ten minute window this had,
      # on a publish that had worked. So this waits up to thirty.
      - name: Confirm the registry serves it
        if: steps.decide.outputs.changed == 'true'
        env:
          NAME: ${{ steps.decide.outputs.name }}
          VERSION: ${{ steps.decide.outputs.version }}
          DOC: ${{ steps.decide.outputs.doc }}
        run: |
          for attempt in $(seq 1 120); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$DOC/$VERSION")
            if [ "$CODE" = "200" ]; then
              echo "::notice::the registry serves $NAME $VERSION"
              exit 0
            fi
            echo "attempt $attempt: the registry answered $CODE"
            sleep 15
          done
          echo "::error::the registry still does not serve $NAME $VERSION"
          exit 1

      # The only step that reads the PUBLISHED bytes: it walks the npm CDN's file tree for this
      # version and compares every file against the list the manifest it serves carries. Everything
      # above measures the runner's own directory.
      #
      # The CDN mirrors the registry rather than sharing it, so it lags the step above by minutes of
      # its own. The loop is the same shape as that one: it retries while the CDN is behind and still
      # fails the job when the answer never comes.
      #
      # WHICH answer decides that, because the two are not the same fact. `answered 404`, `answered
      # 429`, a 5xx and `is unreachable` are all the CDN not answering yet, and another attempt is
      # the only way to tell them from a real absence. Every other refusal is about bytes that are
      # already published and cannot change: `mismatch`, `unlisted`, a name or version the list does
      # not carry. Retrying one of those spends ten minutes reaching the same red the first attempt
      # already had, and buries it under forty lines saying the CDN is behind.
      - name: Verify the published files against the list
        if: steps.decide.outputs.changed == 'true'
        env:
          NAME: ${{ steps.decide.outputs.name }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          for attempt in $(seq 1 40); do
            if npx fkn-sign verify --published "$NAME@$VERSION" 2> "$RUNNER_TEMP/published.err"; then
              exit 0
            fi
            cat "$RUNNER_TEMP/published.err"
            if ! grep -qE 'answered (404|429|5[0-9][0-9])|is unreachable' "$RUNNER_TEMP/published.err"; then
              echo "::error::the published $NAME $VERSION does not match its own list"
              exit 1
            fi
            echo "attempt $attempt: the CDN does not serve $NAME $VERSION yet"
            sleep 15
          done
          echo "::error::the published $NAME $VERSION was never served to read"
          exit 1

      # ---- the https-pkg source, which is a different set of bytes on a different host ----------
      #
      # Everything above is the npm release. What follows publishes the archive and the index that
      # `https-pkg:torrent.fkn.app/ripple` is read from: functions/_middleware.ts serves both out of
      # the R2 bucket, because Cloudflare Pages ignores Range on a static file and the loading side
      # reads a zip by asking for its tail, its directory and then one range per file.

      # --remote IS LOAD BEARING HERE, and leaving it off is silent. wrangler 4 reads LOCAL storage by
      # default ("Resource location: local. Use --remote if you want to access the remote instance.",
      # measured on 4.131.1, 2026-09-12), so without it this reads a miniflare simulator, answers
      # "The specified key does not exist." on every run, and the pack step below then writes a BRAND
      # NEW index holding this version alone, taking every earlier version of ripple off the host.
      #
      # A not-found is the one answer that is not a failure, and only because the first release has no
      # index to read. The match is deliberately narrow: any other stderr fails the job, which leaves
      # the standing index untouched, and that is the safe direction to be wrong in.
      - name: Read the index the host is serving
        if: steps.decide.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p dist
          if npx --yes wrangler@4.131.1 r2 object get fkn-packages/ripple/index.json --file dist/index.json --remote 2> "$RUNNER_TEMP/index.err"; then
            echo "::notice::the host serves an index of $(wc -c < dist/index.json) bytes"
            exit 0
          fi
          cat "$RUNNER_TEMP/index.err"
          if grep -qF 'The specified key does not exist' "$RUNNER_TEMP/index.err"; then
            # a failed get can still leave a file behind, and a zero byte one is a malformed index
            rm -f dist/index.json
            echo "::notice::no index on the host yet, so this release writes the first one"
            exit 0
          fi
          echo "::error::reading fkn-packages/ripple/index.json failed for a reason other than its absence"
          exit 1

      # `pack` runs the packlist AGAIN and re-hashes every file as it reads it, so the archive can
      # only carry the tree the list was signed over: signing and packing are separate steps, and a
      # build that rewrote a file between them would otherwise publish bytes the list cannot account
      # for. `--index` MERGES this version into the document read above and moves `latest` onto it.
      - name: Pack the archive and add it to the index
        if: steps.decide.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          npx fkn-sign pack \
            --package build/package.json \
            --manifest fkn.json \
            --out "dist/ripple-$VERSION.zip" \
            --index dist/index.json \
            --slot ripple \
            --url "/packages/ripple-$VERSION.zip" \
            --default

      # THE ARCHIVE FIRST, THEN THE INDEX, and the order is the rule rather than a preference. The
      # index is the only document that names the archive, so an index uploaded first names bytes that
      # are not there and every boot in that window 404s. The other way round the window holds an
      # archive nothing points at, which no reader can even ask for. `bash -e` is the default shell
      # here, so a failed archive upload never reaches the index line and https-pkg: keeps serving
      # the previous version.
      - name: Upload the archive, then the index
        if: steps.decide.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          npx --yes wrangler@4.131.1 r2 object put "fkn-packages/ripple/ripple-$VERSION.zip" \
            --file "dist/ripple-$VERSION.zip" --content-type application/zip --remote
          npx --yes wrangler@4.131.1 r2 object put fkn-packages/ripple/index.json \
            --file dist/index.json --content-type application/json --remote

      # The only step that reads what torrent.fkn.app actually serves: it fetches the index, downloads
      # the archive whole, reads the manifest inside it and hashes every file against that list.
      #
      # Two minutes rather than the CDN's thirty, because there is no mirror to wait for: the Function
      # reads R2 directly. What this retries is an eventually consistent BUCKET, which shows up as an
      # index from before the upload: `no version` for a release onto an existing index, `no package`
      # for the first one. Every other refusal is about bytes that are already uploaded and cannot
      # change, and retrying one of those reaches the same red two minutes later.
      - name: Verify the published archive against the list
        if: steps.decide.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          for attempt in $(seq 1 8); do
            if npx fkn-sign verify --published "https-pkg:torrent.fkn.app/ripple@$VERSION" 2> "$RUNNER_TEMP/package.err"; then
              exit 0
            fi
            cat "$RUNNER_TEMP/package.err"
            if ! grep -qE 'answered (404|429|5[0-9][0-9])|is unreachable|no version |no package ' "$RUNNER_TEMP/package.err"; then
              echo "::error::the archive torrent.fkn.app serves does not match its own list"
              exit 1
            fi
            echo "attempt $attempt: torrent.fkn.app does not serve ripple $VERSION yet"
            sleep 15
          done
          echo "::error::the archive for ripple $VERSION was never served to read"
          exit 1
